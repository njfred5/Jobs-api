services:
  - type: web
    name: jobs-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true      # Render creates a strong random secret for you
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        value: /tmp/database.sqlite   # free tier = ephemeral disk (see README)
